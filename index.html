<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel - Must See Places</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #14b8a6; 
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    background: #f4f1ec;
    display: flex;
    flex-direction: column;
    padding: 40px 60px;
  }

  /* NAVBAR */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a2e;
  }

  .nav-center {
    font-size: 13px;
    letter-spacing: 2px;
    color: #333;
    font-weight: 600;
  }

  .nav-right {
    display: flex;
    gap: 30px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #333;
    font-weight: 600;
  }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 60px;
    flex-wrap: wrap;
  }

  .text-block {
    flex: 1;
    min-width: 280px;
  }

  .text-block h1 {
    font-size: 59px;
    font-weight: 800;
    color: #1a1a2e;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .text-block p {
    color: #666;
    font-size: 15px;
    line-height: 1.6;
    max-width: 320px;
    margin-bottom: 30px;
  }

  .explore-btn {
    background: linear-gradient(135deg, #0247dd, #83575e);
    color: #fff;
    border: none;
    padding: 14px 34px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(255, 61, 90, 0.35);
  }

  .slider {
    flex: 2;
    display: flex;
    gap: 20px;
    justify-content: center;
    min-width: 320px;
  }

  .card {
    position: relative;
    width: 220px;
    height: 360px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card .overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    color: #fff;
  }

  .card .overlay h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
    align-items: flex-end;
  }

  .card .overlay span {
    font-size: 12px;
    opacity: 0.9;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
  }

  .social {
    display: flex;
    gap: 16px;
  }

  .social a {
    color: #1a1a2e;
    text-decoration: none;
    font-size: 14px;
  }

  .footer-center {
    font-size: 12px;
    letter-spacing: 2px;
    color: #333;
    font-weight: 600;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .page-count {
    font-size: 13px;
    color: #333;
    font-weight: 600;
  }

  .arrows {
    display: flex;
    gap: 10px;
  }

  .arrows button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arrows button:hover {
    background: #eee;
  }
</style>
</head>
